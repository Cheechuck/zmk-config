# config/leptir.conf - feature switches for the firmware.

# Turn on the display (the nice_view shield supplies the status screen).
CONFIG_ZMK_DISPLAY=y

# Deep sleep after 15 minutes without a key press; any key wakes it.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Stronger Bluetooth signal. The antenna sits near copper, pins and the battery.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# How many combos may be held down at the same time (ZMK default is 4).
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8
