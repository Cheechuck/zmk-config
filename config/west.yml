# config/west.yml - tells the build which version of ZMK to download.
# Pinned to the v0.3 release so a change in ZMK cannot break your build overnight.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
  self:
    path: config
