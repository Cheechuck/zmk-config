# build.yaml - tells GitHub which firmware files to build.
# Target: ZMK release v0.3 (board name "nice_nano_v2").
# When you later move to ZMK v0.4 / main, the board becomes "nice_nano//zmk".
---
include:
  # The keyboard itself: your custom shield "leptir" plus ZMK's nice!view driver.
  - board: nice_nano_v2
    shield: leptir nice_view
  # A helper firmware that wipes saved Bluetooth pairings and settings.
  - board: nice_nano_v2
    shield: settings_reset
